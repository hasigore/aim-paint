<!DOCTYPE html>
<html lang="en">
   <head>
      <link rel="stylesheet" href="../css/switcher.css" />
      <link rel="stylesheet" href="../css/settings.css" />
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Micro Aim Trainer</title>
      <meta
         name="description"
         content="Minimalist Micro Aim Trainer - Precision micro-flick aim training with central rectangle maintenance."
      />
      <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
         }
         body,
         html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
            display: flex;
            flex-direction: column;
         }

         /* External HUD Bar Outside Canvas */
         #hud-bar {
            height: 45px;
            background: #181818;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            flex-shrink: 0;
         }
         .hud-item {
            display: flex;
            gap: 8px;
            color: #aaa;
         }
         .hud-item span {
            color: #00d4ff;
         }

         /* Scrollable container that centers the canvas */
         #canvas-container {
            flex-grow: 1;
            overflow: auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: #111;
         }
         canvas {
            display: block;
            cursor: crosshair;
            background: #000;
            border: 2px solid #555;
            box-shadow:
               0 0 30px rgba(0, 0, 0, 0.8),
               inset 0 0 15px rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
         }
      </style>
   </head>
   <body>
      <!-- External HUD Bar -->
      <div id="hud-bar">
         <div class="hud-item">FPS: <span id="hud-fps">60</span></div>
         <div class="hud-item">Hits: <span id="hud-hits">0</span></div>
         <div class="hud-item">Misses: <span id="hud-misses">0</span></div>
         <div class="hud-item">Rect Resets: <span id="hud-resets">0</span></div>
         <div class="hud-item">Penalties: <span id="hud-penalties">0</span></div>
      </div>

      <button id="settings-toggle-btn">Settings (Esc)</button>

      <div id="settings" class="hidden-settings">
         <h3>Micro Trainer Settings</h3>
         <div class="config-group">
            <label>Canvas Width (px) <span class="range-value" id="val-canvasWidth">1200</span></label>
            <input type="range" id="cfg-canvasWidth" value="1200" min="400" max="2500" step="50" />
         </div>
         <div class="config-group">
            <label>Canvas Height (px) <span class="range-value" id="val-canvasHeight">800</span></label>
            <input type="range" id="cfg-canvasHeight" value="800" min="400" max="1600" step="50" />
         </div>
         <div class="config-group">
            <label>Crosshair Color</label>
            <input type="color" id="cfg-crossColor" value="#ff00ff" style="width:100%; height:30px; border:1px solid #555; background:#2a2a2a; cursor:pointer;" />
         </div>
         <div class="config-group">
            <label>Rect Base Size (px) <span class="range-value" id="val-rectBaseSize">14</span></label>
            <input type="range" id="cfg-rectBaseSize" value="14" min="8" max="35" step="1" />
         </div>
         <div class="config-group">
            <label>Rect Max Growth (px) <span class="range-value" id="val-rectMaxGrowth">8</span></label>
            <input type="range" id="cfg-rectMaxGrowth" value="8" min="2" max="25" step="1" />
         </div>
         <div class="config-group">
            <label>Rect Timer (s) <span class="range-value" id="val-rectTimer">0.45</span></label>
            <input type="range" id="cfg-rectTimer" value="0.45" min="0.10" max="2.00" step="0.05" />
         </div>
         <div class="config-group">
            <label>Penalty Delay (s) <span class="range-value" id="val-penaltyDuration">0.8</span></label>
            <input type="range" id="cfg-penaltyDuration" value="0.8" min="0.2" max="3.0" step="0.1" />
         </div>
         <div class="config-group">
            <label>Dot Radius (px) <span class="range-value" id="val-dotRadius">5</span></label>
            <input type="range" id="cfg-dotRadius" value="5" min="2" max="15" step="1" />
         </div>
         <div class="config-group">
            <label>Dot Lifespan (s) <span class="range-value" id="val-dotLifespan">0.8</span></label>
            <input type="range" id="cfg-dotLifespan" value="0.8" min="0.2" max="2.5" step="0.05" />
         </div>
         <div class="config-group">
            <label>Offset Min (px) <span class="range-value" id="val-offsetMin">30</span></label>
            <input type="range" id="cfg-offsetMin" value="30" min="10" max="100" step="5" />
         </div>
         <div class="config-group">
            <label>Offset Max (px) <span class="range-value" id="val-offsetMax">75</span></label>
            <input type="range" id="cfg-offsetMax" value="75" min="30" max="200" step="5" />
         </div>
         <div class="config-group">
            <label class="checkbox-label">
               <input type="checkbox" id="cfg-justHover" checked /> Just Hover (No click required)
            </label>
         </div>
         <div class="config-group">
            <button id="btn-fullscreen" class="btn-action">Toggle Fullscreen</button>
            <button id="btn-reset-stats" class="btn-action" style="margin-top: 6px;">Reset Statistics</button>
         </div>
      </div>

      <div id="canvas-container">
         <canvas id="aimCanvas"></canvas>
      </div>

      <script>
         const Config = {
            canvas: { width: 1200, height: 800 },
            crosshair: { color: "#ff00ff" },
            rect: {
               baseSize: 14,
               maxGrowth: 8,
               timer: 0.45,
               penaltyDuration: 0.8,
               fillColor: "#0088ff",
               strokeColor: "#00e5ff"
            },
            dot: {
               radius: 5,
               lifespan: 0.8,
               offsetMin: 30,
               offsetMax: 75
            },
            aim: {
               justHover: true
            }
         };

         // Stats Tracking
         let hits = 0;
         let misses = 0;
         let resets = 0;
         let penalties = 0;

         // Game Loop State
         let rectTimeRemaining = Config.rect.timer;
         let isPenalty = false;
         let penaltyTimeRemaining = 0;
         let currentDot = null;

         const canvas = document.getElementById("aimCanvas");
         const ctx = canvas.getContext("2d");

         function updateCanvasDimensions(w, h) {
            canvas.width = Config.canvas.width = w;
            canvas.height = Config.canvas.height = h;
            resetState();
         }

         function updateCustomCursor() {
            const rawSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="2.5" fill="${Config.crosshair.color}"/><line x1="16" y1="2" x2="16" y2="7" stroke="${Config.crosshair.color}" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="30" stroke="${Config.crosshair.color}" stroke-width="2" stroke-linecap="round"/><line x1="2" y1="16" x2="7" y2="16" stroke="${Config.crosshair.color}" stroke-width="2" stroke-linecap="round"/><line x1="25" y1="16" x2="30" y2="16" stroke="${Config.crosshair.color}" stroke-width="2" stroke-linecap="round"/></svg>`;
            canvas.style.cursor = `url("data:image/svg+xml;base64,${btoa(rawSvg)}") 16 16, crosshair`;
         }

         function spawnDot() {
            if (isPenalty) return;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            const angle = Math.random() * Math.PI * 2;
            const minDist = Config.dot.offsetMin;
            const maxDist = Math.max(Config.dot.offsetMin + 5, Config.dot.offsetMax);
            const dist = minDist + Math.random() * (maxDist - minDist);

            let x = cx + Math.cos(angle) * dist;
            let y = cy + Math.sin(angle) * dist;

            const margin = Config.dot.radius + 10;
            x = Math.max(margin, Math.min(canvas.width - margin, x));
            y = Math.max(margin, Math.min(canvas.height - margin, y));

            currentDot = {
               x,
               y,
               createdAt: performance.now(),
               lifespan: Config.dot.lifespan
            };
         }

         function resetRectTimer() {
            rectTimeRemaining = Config.rect.timer;
         }

         function resetState() {
            isPenalty = false;
            penaltyTimeRemaining = 0;
            resetRectTimer();
            spawnDot();
         }

         function triggerPenalty() {
            isPenalty = true;
            penaltyTimeRemaining = Config.rect.penaltyDuration;
            penalties++;
            currentDot = null;
         }

         function getDotColor(lifeRatio) {
            const clamped = Math.max(0, Math.min(1, lifeRatio));
            const r = Math.round(255 * (1 - clamped));
            const g = Math.round(255 * clamped);
            const b = Math.round(68 * (1 - clamped) + 136 * clamped);
            return `rgb(${r}, ${g}, ${b})`;
         }

         let mousePos = { x: 0, y: 0 };

         function checkHit() {
            if (isPenalty) return;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            const timeRatio = Math.max(0, rectTimeRemaining / Config.rect.timer);
            const currentSize = Config.rect.baseSize + (1 - timeRatio) * Config.rect.maxGrowth;
            const halfSize = currentSize / 2;

            if (
               mousePos.x >= cx - halfSize &&
               mousePos.x <= cx + halfSize &&
               mousePos.y >= cy - halfSize &&
               mousePos.y <= cy + halfSize
            ) {
               resets++;
               resetRectTimer();
               return;
            }

            if (currentDot) {
               const dist = Math.hypot(mousePos.x - currentDot.x, mousePos.y - currentDot.y);
               if (dist <= Config.dot.radius + 2) {
                  hits++;
                  spawnDot();
               }
            }
         }

         canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

            if (Config.aim.justHover) {
               checkHit();
            }
         });

         canvas.addEventListener("mousedown", (e) => {
            if (e.button !== 0) return;
            if (!Config.aim.justHover) {
               checkHit();
            }
         });

         const menuBtn = document.getElementById("settings-toggle-btn");
         const menu = document.getElementById("settings");

         function toggleMenu() {
            menu.classList.toggle("hidden-settings");
         }

         menuBtn.addEventListener("click", toggleMenu);

         window.addEventListener("keydown", (e) => {
            if (e.key === "Escape" || e.key === "Tab") {
               e.preventDefault();
               toggleMenu();
            }
         });

         document.getElementById("btn-fullscreen").addEventListener("click", () => {
            if (!document.fullscreenElement) {
               document.documentElement.requestFullscreen().catch(() => {});
            } else {
               if (document.exitFullscreen) document.exitFullscreen();
            }
         });

         document.getElementById("btn-reset-stats").addEventListener("click", () => {
            hits = 0;
            misses = 0;
            resets = 0;
            penalties = 0;
            resetState();
         });

         function bindInput(id, obj, key, parser = parseFloat, callback) {
            const el = document.getElementById(id);
            const valSpan = document.getElementById(`val-${id.replace("cfg-", "")}`);
            if (el) {
               el.value = obj[key];
               if (valSpan) valSpan.innerText = obj[key];
               el.addEventListener("input", (e) => {
                  const val = parser(e.target.value);
                  obj[key] = val;
                  if (valSpan) valSpan.innerText = val;
                  if (callback) callback(val);
               });
            }
         }

         bindInput("cfg-canvasWidth", Config.canvas, "width", parseInt, (val) => updateCanvasDimensions(val, Config.canvas.height));
         bindInput("cfg-canvasHeight", Config.canvas, "height", parseInt, (val) => updateCanvasDimensions(Config.canvas.width, val));
         bindInput("cfg-rectBaseSize", Config.rect, "baseSize", parseInt);
         bindInput("cfg-rectMaxGrowth", Config.rect, "maxGrowth", parseInt);
         bindInput("cfg-rectTimer", Config.rect, "timer", parseFloat, () => resetRectTimer());
         bindInput("cfg-penaltyDuration", Config.rect, "penaltyDuration", parseFloat);
         bindInput("cfg-dotRadius", Config.dot, "radius", parseInt);
         bindInput("cfg-dotLifespan", Config.dot, "lifespan", parseFloat);
         bindInput("cfg-offsetMin", Config.dot, "offsetMin", parseInt);
         bindInput("cfg-offsetMax", Config.dot, "offsetMax", parseInt);

         const hoverCheckbox = document.getElementById("cfg-justHover");
         hoverCheckbox.checked = Config.aim.justHover;
         hoverCheckbox.addEventListener("change", (e) => {
            Config.aim.justHover = e.target.checked;
         });

         document.getElementById("cfg-crossColor").addEventListener("input", (e) => {
            Config.crosshair.color = e.target.value;
            updateCustomCursor();
         });

         let fpsSamples = [];
         let lastFrameTime = performance.now();
         let currentFps = 60;

         function animate(now) {
            const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            fpsSamples.push(1 / (dt || 0.016));
            if (fpsSamples.length > 30) fpsSamples.shift();
            currentFps = fpsSamples.reduce((a, b) => a + b, 0) / fpsSamples.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (isPenalty) {
               penaltyTimeRemaining -= dt;
               if (penaltyTimeRemaining <= 0) {
                  resetState();
               }
            } else {
               if (Config.aim.justHover) {
                  const timeRatio = Math.max(0, rectTimeRemaining / Config.rect.timer);
                  const currentSize = Config.rect.baseSize + (1 - timeRatio) * Config.rect.maxGrowth;
                  const halfSize = currentSize / 2;

                  if (
                     mousePos.x >= cx - halfSize &&
                     mousePos.x <= cx + halfSize &&
                     mousePos.y >= cy - halfSize &&
                     mousePos.y <= cy + halfSize
                  ) {
                     resetRectTimer();
                  }
               }

               rectTimeRemaining -= dt;
               if (rectTimeRemaining <= 0) {
                  triggerPenalty();
               }

               if (currentDot) {
                  const elapsed = (now - currentDot.createdAt) / 1000;
                  if (elapsed >= currentDot.lifespan) {
                     misses++;
                     currentDot = null;
                     spawnDot();
                  }
               }
            }

            ctx.save();
            ctx.translate(cx, cy);

            const timeRatio = isPenalty ? 0 : Math.max(0, rectTimeRemaining / Config.rect.timer);
            const currentSize = Config.rect.baseSize + (1 - timeRatio) * Config.rect.maxGrowth;
            const halfSize = currentSize / 2;

            ctx.fillStyle = isPenalty ? "#331111" : Config.rect.fillColor;
            ctx.strokeStyle = isPenalty ? "#ff3333" : Config.rect.strokeColor;
            ctx.lineWidth = 1.5;

            ctx.fillRect(-halfSize, -halfSize, currentSize, currentSize);
            ctx.strokeRect(-halfSize, -halfSize, currentSize, currentSize);
            ctx.restore();

            if (!isPenalty && currentDot) {
               const elapsed = (now - currentDot.createdAt) / 1000;
               const lifeRatio = Math.max(0, 1 - (elapsed / currentDot.lifespan));
               const dotColor = getDotColor(lifeRatio);

               ctx.beginPath();
               ctx.arc(currentDot.x, currentDot.y, Config.dot.radius, 0, Math.PI * 2);
               ctx.fillStyle = dotColor;
               ctx.fill();
               ctx.closePath();
            }

            document.getElementById("hud-fps").innerText = Math.round(currentFps);
            document.getElementById("hud-hits").innerText = hits;
            document.getElementById("hud-misses").innerText = misses;
            document.getElementById("hud-resets").innerText = resets;
            document.getElementById("hud-penalties").innerText = penalties;

            requestAnimationFrame(animate);
         }

         window.onload = () => {
            updateCanvasDimensions(Config.canvas.width, Config.canvas.height);
            updateCustomCursor();
            resetState();
            requestAnimationFrame(animate);
         };
      </script>
      <script src="../js/switcher.js"></script>
   </body>
</html>
